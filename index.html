  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // AI Studio runtime constraint: HMR is disabled; ignore/neutralize dev WebSocket errors.
        if (typeof window !== 'undefined') {
          const OriginalWebSocket = window.WebSocket;
          if (OriginalWebSocket) {
            window.WebSocket = function(url, protocols) {
              const urlStr = String(url || '');
              const protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
              const isViteHmr = urlStr.includes('token=') || urlStr.includes('vite') || protoStr.includes('vite-hmr');
              
              if (isViteHmr) {
                const listeners = {};
                return {
                  readyState: 1, // WebSocket.OPEN
                  OPEN: 1,
                  CONNECTING: 0,
                  CLOSING: 2,
                  CLOSED: 3,
                  url: urlStr,
                  protocol: 'vite-hmr',
                  binaryType: 'blob',
                  bufferedAmount: 0,
                  extensions: '',
                  send: function() {},
                  close: function() {},
                  addEventListener: function(event, callback) {
                    if (!listeners[event]) listeners[event] = [];
                    listeners[event].push(callback);
                    if (event === 'open') {
                      setTimeout(function() {
                        try { callback(new Event('open')); } catch(e) {}
                      }, 0);
                    }
                  },
                  removeEventListener: function(event, callback) {
                    if (!listeners[event]) return;
                    listeners[event] = listeners[event].filter(function(cb) { return cb !== callback; });
                  },
                  dispatchEvent: function() { return true; }
                };
              }
              return new OriginalWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OriginalWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }

          const isViteWsError = function(val) {
            if (!val) return false;
            if (val instanceof Error) {
              return /WebSocket|websocket|\[vite\]|@vite\/client/i.test(val.message + ' ' + (val.stack || ''));
            }
            if (typeof val === 'object') {
              try {
                return /WebSocket|websocket|\[vite\]|@vite\/client/i.test(JSON.stringify(val) + ' ' + (val.message || '') + ' ' + (val.stack || ''));
              } catch {
                return false;
              }
            }
            return /WebSocket|websocket|\[vite\]|@vite\/client/i.test(String(val));
          };

          const _origConsoleError = console.error;
          console.error = function(...args) {
            if (args.some(isViteWsError)) return;
            return _origConsoleError.apply(console, args);
          };

          const _origConsoleWarn = console.warn;
          console.warn = function(...args) {
            if (args.some(isViteWsError)) return;
            return _origConsoleWarn.apply(console, args);
          };

          window.addEventListener('error', function(e) {
            if (isViteWsError(e.error) || isViteWsError(e.message) || isViteWsError(e.filename)) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(e) {
            if (isViteWsError(e.reason)) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return true;
            }
          }, true);
        }
      })();
    </script>
